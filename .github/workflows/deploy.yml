name: CI/CD with Docker

on:
  push:
    branches: [ "week9" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      # Secrets에 저장한 application.yml 생성
      - name: Make application.yml
        run: |
          mkdir -p ./blog/src/main/resources
          printf "%s" "${{ secrets.APPLICATION }}" > ./blog/src/main/resources/application.yml

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          cd ./blog
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🔧 멀티아키텍처 빌드 준비(QEMU + buildx)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔥 멀티플랫폼 이미지 빌드 & 푸시 (amd64, arm64 둘 다)
      - name: Docker build & push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./blog
          file: ./blog/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_REPO }}:latest

      # EC2 배포
      - name: Deploy to Server (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            sudo docker rm -f $(sudo docker ps -qa) 2>/dev/null || true
            sudo docker pull ${{ secrets.DOCKER_REPO }}:latest
            sudo docker run -d --name blog --restart=always -p 8080:8080 ${{ secrets.DOCKER_REPO }}:latest
            sudo docker image prune -f
